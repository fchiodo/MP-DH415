# =============================================================================
# nginx site config — MP-DH415 Trading Bot
# Serve il frontend React (build statica) e fa da reverse proxy per l'API Flask
# sulla stessa VM. Così:
#   - il frontend chiama /api/* con URL relativi (niente CORS)
#   - la porta 5001 non deve essere esposta su internet
# Installato da deploy/gcp_setup.sh in /etc/nginx/sites-available/trading-bot
# (i placeholder __REPO_DIR__ vengono sostituiti dallo script di setup)
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # CONSIGLIATO: proteggi la dashboard con una password. La UI espone le
    # credenziali FXCM (pagina Settings) e i controlli Start/Stop del bot.
    # Per attivare:
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd tuoutente
    # poi togli il commento alle due righe seguenti e: sudo systemctl reload nginx
    # auth_basic "Trading Bot";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    root __REPO_DIR__/frontend/dist;
    index index.html;

    # SPA: ogni rotta non trovata torna a index.html (es. /settings)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Flask (gunicorn su localhost:5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (Server-Sent Events): niente buffering, connessione lunga
    location /api/logs/stream {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}
